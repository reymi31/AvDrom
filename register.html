<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/register.css">
</head>
<body>

<div class="register-container">
    <form class="register-form" action="/api/auth/register" method="POST">
        <h2>Регистрация аккаунта</h2>

        <input type="text" name="name" placeholder="Имя" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="tel" name="phone" placeholder="Телефон" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <small style="display:block; margin:-8px 0 16px; color:#5e6783; text-align:left;">Пароль минимум 8 символов, с заглавной буквой, цифрой и спецсимволом.</small>

        <button type="submit">Зарегистрироваться</button>
        <p>Уже есть аккаунт? <a href="/auth/login">Войти</a></p>
    </form>
</div>
<script>
    document.querySelector('.register-form').addEventListener('submit', function (event) {
        const password = event.target.password.value;
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#\$%\^&\*])(?=.{8,})/;
        if (!passwordRegex.test(password)) {
            event.preventDefault();
            alert('Пароль должен содержать минимум 8 символов, включая заглавную букву, цифру и специальный символ.');
        }
    });
</script>
</body>
</html>
