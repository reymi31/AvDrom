<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>О нас</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>AvDrom</h1>
        <nav id="main-nav">
            <a href="/">Главная</a>
            <a href="/cars">Каталог</a>
            <a href="/about">О нас</a>
            <a href="/favorites" data-private class="hidden">Избранное</a>
            <a href="/profile" data-private class="hidden">Профиль</a>
            <span id="user-chip" class="user-chip hidden"></span>
            <a href="/auth/login" id="auth-link">Войти</a>
        </nav>
    </header>

    <section class="hero profile-hero">
        <h2 id="about-title">Загрузка...</h2>
        <p>Информация о проекте AvDrom.</p>
    </section>

    <section class="about profile-panel" style="max-width: 980px;">
        <div id="about-loading" class="spinner"></div>
        <div id="about-error" class="error-banner hidden"></div>
        <div id="about-content" class="hidden"></div>
    </section>

    <footer>
        <p>© 2026 AvDrom. Все права защищены.</p>
    </footer>

    <script src="/app.js"></script>
    <script>
        async function loadAbout() {
            const startedAt = Date.now();
            const defaultParagraphs = [
                'AvDrom — это простая и удобная площадка для поиска и продажи автомобилей.',
                'Здесь можно быстро отобрать авто по марке, модели, цене и году выпуска.'
            ];
            const hideSpinner = () => {
                document.getElementById('about-loading').classList.add('hidden');
                document.getElementById('about-content').classList.remove('hidden');
            };

            const fallbackTimer = setTimeout(() => {
                if (document.getElementById('about-content').classList.contains('hidden')) {
                    Avdrom.setHTML('about-content', defaultParagraphs.map((p) => `<p>${p}</p>`).join(''));
                    hideSpinner();
                }
            }, 1800);

            try {
                const content = await Avdrom.loadContent('about');
                Avdrom.setText('about-title', content.title || 'О нас');

                const paragraphs = Array.isArray(content.paragraphs) && content.paragraphs.length > 0
                    ? content.paragraphs
                    : defaultParagraphs;
                Avdrom.setHTML('about-content', paragraphs.map((p) => `<p>${p}</p>`).join(''));
            } catch (err) {
                Avdrom.setText('about-title', 'О нас');
                Avdrom.setHTML('about-content', defaultParagraphs.map((p) => `<p>${p}</p>`).join(''));
            } finally {
                clearTimeout(fallbackTimer);
                await Avdrom.ensureMinDuration(startedAt, 1200);
                hideSpinner();
            }
        }

        (async () => {
            await Avdrom.initAuth();
            await loadAbout();
        })();
    </script>
</body>
</html>
