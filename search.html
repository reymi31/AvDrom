<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>AvDrom</h1>
        <nav id="main-nav">
            <a href="/">Главная</a>
            <a href="/cars">Каталог</a>
            <a href="/about">О нас</a>
            <a href="/favorites" data-private class="hidden">Избранное</a>
            <a href="/profile" data-private class="hidden">Профиль</a>
            <span id="user-chip" class="user-chip hidden"></span>
            <a href="/auth/login" id="auth-link">Войти</a>
        </nav>
    </header>

    <section class="hero profile-hero">
        <h2 id="search-title">Поиск</h2>
        <p id="search-subtitle">Загрузка...</p>
    </section>

    <main class="home-layout">
        <section class="profile-panel home-filters-panel">
            <div class="panel-header">
                <div>
                    <h3>Поиск по каталогу</h3>
                    <p class="panel-subtitle">Введи запрос и нажми «Найти».</p>
                </div>
            </div>

            <div id="search-error" class="error-banner hidden"></div>

            <form id="search-form" class="filters-grid">
                <input type="text" id="search-q" placeholder="Поиск: название, марка, модель">
                <select id="search-sort">
                    <option value="date_desc">Сначала новые</option>
                    <option value="price_asc">Цена по возрастанию</option>
                    <option value="price_desc">Цена по убыванию</option>
                </select>
                <button type="submit" class="primary-button compact-button">Найти</button>
            </form>
        </section>

        <section class="cars home-cars-section">
            <div id="search-loading" class="skeleton-grid hidden"></div>
            <div id="search-items" class="cars-container"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 AvDrom. Все права защищены.</p>
    </footer>

    <script src="/app.js"></script>
    <script>
        function setLoading(isLoading) {
            const skeleton = document.getElementById('search-loading');
            skeleton.classList.toggle('hidden', !isLoading);
            if (isLoading) {
                skeleton.innerHTML = new Array(6).fill(0).map(() => '<div class="skeleton-card"></div>').join('');
            }
        }

        function getUrlQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('q') || '';
        }

        function cardHtml(item) {
            const vipClass = item.isVip ? 'vip-card' : '';
            const badge = item.isVip ? 'VIP' : item.brand;
            const img = item.imageData
                ? `<img src="${item.imageData}" alt="${item.title}">`
                : '<div class="image-placeholder">Фото не загружено</div>';

            return `
                <article class="car-card listing-card ${vipClass}">
                    ${img}
                    <div class="card-badge">${badge}</div>
                    <h3>${item.title}</h3>
                    <p class="price-line">${Avdrom.formatPrice(item.price)} $</p>
                    <p>${item.brand} ${item.model}${item.year ? `, ${item.year} г.` : ''}</p>
                    <p>${item.description || 'Описание пока не добавлено.'}</p>
                    <div class="card-actions">
                        <a class="secondary-button" href="/cars/${item.id}" style="text-align:center; padding: 11px 16px; border-radius: 12px;">Подробнее</a>
                    </div>
                </article>
            `;
        }

        async function loadPageContent() {
            try {
                const content = await Avdrom.loadContent('search');
                Avdrom.setText('search-title', content.title);
                Avdrom.setText('search-subtitle', content.subtitle);
            } catch {
                Avdrom.setText('search-subtitle', 'Поиск по объявлениям');
            }
        }

        async function performSearch() {
            Avdrom.clearError('search-error');
            setLoading(true);
            try {
                const q = document.getElementById('search-q').value.trim();
                const sort = document.getElementById('search-sort').value;
                const params = new URLSearchParams();
                if (q) params.set('q', q);
                if (sort) params.set('sort', sort);
                params.set('limit', '12');
                params.set('offset', '0');

                const items = await Avdrom.apiJson(`/api/items?${params.toString()}`);
                const container = document.getElementById('search-items');
                if (!Array.isArray(items) || items.length === 0) {
                    container.innerHTML = '<p class="empty-state">Ничего не найдено.</p>';
                } else {
                    container.innerHTML = items.map(cardHtml).join('');
                }
                history.replaceState(null, '', `/search?q=${encodeURIComponent(q)}`);
            } catch (err) {
                Avdrom.showError('search-error', Avdrom.normalizeErrorMessage(err));
            } finally {
                setLoading(false);
            }
        }

        document.getElementById('search-form').addEventListener('submit', (event) => {
            event.preventDefault();
            performSearch();
        });

        (async () => {
            await Avdrom.initAuth();
            await loadPageContent();
            document.getElementById('search-q').value = getUrlQuery();
            await performSearch();
        })();
    </script>
</body>
</html>
